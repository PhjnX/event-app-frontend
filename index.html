    <!-- Google Tag Manager - Lazy Loaded -->
    <script>
      // Lazy load GTM after 3 seconds or on user interaction
      function loadGTM() {
        if (window.gtmLoaded) return;
        window.gtmLoaded = true;
        
        const script = document.createElement("script");
        script.async = true;
        script.src = "https://www.googletagmanager.com/gtag/js?id=G-7QDBT9S7B1";
        document.head.appendChild(script);
        
        window.dataLayer = window.dataLayer || [];
        function gtag() {
          dataLayer.push(arguments);
        }
        gtag("js", new Date());
        gtag("config", "G-7QDBT9S7B1");
      }
      
      // Load after 3 seconds
      setTimeout(loadGTM, 3000);
      
      // Or load on first user interaction
      const events = ["mousedown", "touchstart", "keydown", "scroll"];
      events.forEach(event => {
        document.addEventListener(event, loadGTM, { once: true, passive: true });
      });
    </script>
